name: build-ollama-swift

on:
  push:
    paths:
      - "ollama-swift/**"
    branches:
      - build/ollama-swift-dockerfile
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Derive Ollama version from Dockerfile
        id: version
        run: |
          OLLAMA_VERSION=$(sed -n 's/^ARG OLLAMA_VERSION=//p' ollama-swift/Dockerfile | head -n 1)
          BUILD_VERSION=$(sed -n 's/^ARG BUILD_VERSION=//p' ollama-swift/Dockerfile | head -n 1)
          IMAGE_TAG="${OLLAMA_VERSION#v}-rocm"
          echo "ollama_version=$OLLAMA_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=${OLLAMA_VERSION#v}-tuned" >> "$GITHUB_OUTPUT"
          echo "Dockerfile OLLAMA_VERSION=$OLLAMA_VERSION BUILD_VERSION=$BUILD_VERSION IMAGE_TAG=$IMAGE_TAG tag=${OLLAMA_VERSION#v}-tuned"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ollama-swift
          file: ./ollama-swift/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            OLLAMA_VERSION=${{ steps.version.outputs.ollama_version }}
            OLLAMA_IMAGE_TAG=${{ steps.version.outputs.image_tag }}
            BUILD_VERSION=${{ steps.version.outputs.build_version }}
          tags: |
            ghcr.io/tylertitsworth/ai-cluster-ollama-swift:${{ steps.version.outputs.tag }}
            ghcr.io/tylertitsworth/ai-cluster-ollama-swift:${{ steps.version.outputs.build_version }}-tuned
