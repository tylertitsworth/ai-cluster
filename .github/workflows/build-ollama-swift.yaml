name: build-ollama-swift

on:
  push:
    paths:
      - "ollama-swift/**"
    branches:
      - build/ollama-swift-dockerfile
  workflow_dispatch:

env:
  OLLAMA_VERSION: v0.40.15
  IMAGE: ghcr.io/tylertitsworth/ai-cluster-ollama-swift

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          v=${OLLAMA_VERSION#v}
          echo "image_tag=${v}-rocm" >> "$GITHUB_OUTPUT"
          echo "build_version=${v}-swift" >> "$GITHUB_OUTPUT"
          echo "tag=${v}-tuned" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./ollama-swift
          push: true
          platforms: linux/amd64
          build-args: |
            OLLAMA_VERSION=${{ env.OLLAMA_VERSION }}
            OLLAMA_IMAGE_TAG=${{ steps.meta.outputs.image_tag }}
            BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.build_version }}
