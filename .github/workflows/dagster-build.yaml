name: build-dagster-containers
permissions:
  contents: read
  packages: write
on:
  workflow_dispatch: null
  push:
    branches:
      - add/dagster
    paths:
      - 'dagster/docker/*'
  pull_request:
    paths:
      - 'dagster/docker/*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - image: dagster-celery-k8s
            dockerfile: dagster/docker/Dockerfile.celery-k8s
          - image: dagster-k8s
            dockerfile: dagster/docker/Dockerfile.k8s
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dagster/docker
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          platforms: linux/amd64,linux/arm64
