name: build-historyserver-containers
on:
  workflow_dispatch: null
  push:
    branches:
      - main
    paths:
      - '.github/workflows/historyserver-build.yaml'

env:
  # Pinned to a master commit, not a tagged release - v1.6.2 can't parse Ray 2.55 task events.
  KUBERAY_REF: 052b7c34fbb6a32c91db1842f61fcfcf2702a2f5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        component:
          - name: historyserver
            dockerfile: Dockerfile.historyserver
          - name: collector
            dockerfile: Dockerfile.collector
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
          tags: |
            type=raw,value=${{ env.KUBERAY_REF }}
      - uses: docker/build-push-action@v6
        with:
          context: https://github.com/ray-project/kuberay.git#${{ env.KUBERAY_REF }}:historyserver
          file: ${{ matrix.component.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Upstream Dockerfiles hardcode GOARCH=amd64.
          platforms: linux/amd64
