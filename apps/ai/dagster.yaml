# Dagster - orchestration dashboard (webserver + daemon + code server).
# Code syncs from this repo via git-sync (dagster/ on the pinned branch);
# ops submit KubeRay RayJob CRs directly through the kubernetes client
# (included in the dagster/dagster-k8s image), mirroring airflow's
# ray_train_workflow.
#
# NOTE: gitSync ref and the manifests source pin branch "add/dagster";
# flip both to "main" after this branch merges.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dagster
  namespace: argocd
  labels:
    stack: ai
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://dagster-io.github.io/helm
      chart: dagster
      targetRevision: 1.13.17
      helm:
        valuesObject:
          # Official dagster images are amd64-only; our builds add arm64
          # so they run on the Jetson nodes (npu01/02, orinnx01).
          dagsterWebserver:
            image:
              repository: "ghcr.io/tylertitsworth/dagster-celery-k8s"
              tag: "latest"
              pullPolicy: Always
            volumes:
              - name: compute-logs
                persistentVolumeClaim:
                  claimName: dagster-compute-logs
            volumeMounts:
              - name: compute-logs
                mountPath: /var/logs/dagster/compute
          dagsterDaemon:
            image:
              repository: "ghcr.io/tylertitsworth/dagster-celery-k8s"
              tag: "latest"
              pullPolicy: Always
            volumes:
              - name: compute-logs
                persistentVolumeClaim:
                  claimName: dagster-compute-logs
            volumeMounts:
              - name: compute-logs
                mountPath: /var/logs/dagster/compute
          runLauncher:
            config:
              k8sRunLauncher:
                image:
                  repository: "ghcr.io/tylertitsworth/dagster-k8s"
                  tag: "latest"
                  pullPolicy: Always
                volumes:
                  - name: compute-logs
                    persistentVolumeClaim:
                      claimName: dagster-compute-logs
                volumeMounts:
                  - name: compute-logs
                    mountPath: /var/logs/dagster/compute
          # Code server image doubles as the K8s run pod image (K8sRunLauncher
          # pulls it from the code location at launch time) and ships the
          # kubernetes client ops need to submit RayJobs.
          dagster-user-deployments:
            deployments:
              - name: "dagster-ai"
                image:
                  repository: "ghcr.io/tylertitsworth/dagster-k8s"
                  tag: "latest"
                  pullPolicy: Always
                dagsterApiGrpcArgs:
                  - "--python-file"
                  - "/git/repo/dagster/rayjobs.py"
                port: 3030
                volumes:
                  - name: repo
                    emptyDir: {}
                volumeMounts:
                  - name: repo
                    mountPath: /git
                # Clone once at startup, then keep the sidecar in sync.
                initContainers:
                  - name: git-sync-init
                    image: registry.k8s.io/git-sync/git-sync:v4.4.2
                    args:
                      - "--repo=https://github.com/tylertitsworth/ai-cluster.git"
                      - "--branch=add/dagster"
                      - "--depth=1"
                      - "--root=/git"
                      - "--dest=repo"
                      - "--one-time"
                    volumeMounts:
                      - name: repo
                        mountPath: /git
                sidecarContainers:
                  - name: git-sync
                    image: registry.k8s.io/git-sync/git-sync:v4.4.2
                    args:
                      - "--repo=https://github.com/tylertitsworth/ai-cluster.git"
                      - "--branch=add/dagster"
                      - "--depth=1"
                      - "--root=/git"
                      - "--dest=repo"
                      - "--wait=1"
                    volumeMounts:
                      - name: repo
                        mountPath: /git
          # Capture op stdout/stderr to shared NFS (manifests/dagster/compute-logs-pvc.yaml)
          # so the webserver can show compute logs for runs executing on any node.
          computeLogManager:
            type: LocalComputeLogManager
            config:
              localComputeLogManager:
                baseDir: /var/logs/dagster/compute
          # Metadata DB on longhorn, matching the airflow postgres.
          postgresql:
            persistence:
              storageClass: longhorn
              size: 8Gi
          # Tailscale ingress in front of the webserver.
          ingress:
            enabled: true
            ingressClassName: tailscale
            annotations:
              tailscale.com/proxy-class: "pin-framework-desktop"
            dagsterWebserver:
              host: dagster
              path: /
              pathType: ImplementationSpecific
              tls:
                enabled: true
    - repoURL: https://github.com/tylertitsworth/ai-cluster.git
      targetRevision: add/dagster
      path: manifests/dagster
  destination:
    server: https://kubernetes.default.svc
    namespace: dagster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
