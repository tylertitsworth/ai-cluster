apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: ollama
  labels:
    app.kubernetes.io/instance: llama-cpp
    app.kubernetes.io/name: llama-cpp
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: llama-cpp
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: llama-cpp
        app.kubernetes.io/name: llama-cpp
    spec:
      nodeSelector:
        kubernetes.io/hostname: framework-desktop
      containers:
        - name: llama-cpp
          image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/start.sh"]
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          ports:
            - containerPort: 11434
              name: http
              protocol: TCP
          resources:
            limits:
              amd.com/gpu: 1
            requests:
              amd.com/gpu: 1
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            - name: llama-cpp-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
        - name: llama-cpp-config
          configMap:
            name: llama-cpp-config
            defaultMode: 0755
