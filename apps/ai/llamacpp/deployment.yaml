apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: framework-desktop
      containers:
        - name: ollama
          image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/start.sh"]
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          ports:
            - containerPort: 11434
              name: http
              protocol: TCP
          resources:
            limits:
              amd.com/gpu: 1
            requests:
              amd.com/gpu: 1
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            - name: ollama-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
        - name: ollama-config
          configMap:
            name: ollama-llama-server-config
            defaultMode: 0755
