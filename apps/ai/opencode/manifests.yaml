# OpenCode headless server — access via Tailscale from VS Code / phone
# Multi-session: client creates sessions via POST /session.
#   VS Code + OpenCode IDE extension, browser (phone), curl, any HTTP client.
# Config + sessions persist in /root/.opencode (mounted PVC).
# Workspace seeded by init container cloning ai-cluster.
# Default provider/model: vLLM via k8s DNS (vllm-server.ollama.svc.cluster.local:8000)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-workspace
  namespace: opencode
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: opencode
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "vllm/cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit",
      "provider": {
        "vllm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "vLLM",
          "options": {
            "baseURL": "http://vllm-server.ollama.svc.cluster.local:8000/v1"
          },
          "models": {
            "cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit": {
              "name": "Qwen3.6-35B-A3B-AWQ-4bit"
            }
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app: opencode
    stack: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
        stack: ai
    spec:
      nodeName: framework-desktop
      initContainers:
        - name: clone-repos
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /workspace
              rm -rf /workspace/lost+found
              if [ ! -d /workspace/.git ]; then
                echo "Cloning ai-cluster into /workspace..."
                git clone --depth 1 https://github.com/tylertitsworth/ai-cluster.git /workspace
                echo "Done."
              else
                echo "Workspace already seeded, skipping clone."
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          imagePullPolicy: Always
          workingDir: /workspace
          command:
            - opencode
            - serve
            - --hostname=0.0.0.0
            - --port=4096
            - --cors=https://open-vsx.org
            - --cors=vscode
            - --cors=http://127.0.0.1:4096
            - --cors=http://localhost:4096
          ports:
            - containerPort: 4096
              name: http
          env:
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secret
                  key: password
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: opencode-data
              mountPath: /root/.opencode
            - name: config
              mountPath: /root/.config/opencode/opencode.json
              subPath: opencode.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /global/health
              port: 4096
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /global/health
              port: 4096
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: config
          configMap:
            name: opencode-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode
  labels:
    app: opencode
    stack: ai
spec:
  type: ClusterIP
  selector:
    app: opencode
  ports:
    - port: 4096
      targetPort: 4096
      name: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode
  namespace: opencode
  labels:
    app: opencode
    stack: ai
  annotations:
    tailscale.com/proxy-class: pin-framework-desktop
spec:
  ingressClassName: tailscale
  rules:
    - host: opencode
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencode
                port:
                  number: 4096
  tls:
    - hosts:
        - opencode
