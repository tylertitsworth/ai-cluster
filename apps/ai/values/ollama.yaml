# ollama chart values for AMD ROCm + Tailscale ingress
fullnameOverride: ollama

image:
  repository: ghcr.io/tylertitsworth/ollama-swift
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

ollama:
  gpu:
    enabled: true
    type: amd
    number: 1
  models:
    create:
      - name: nemotron-3.5-bolt
        template: |
          FROM nemotron-3.5-bolt
    run:
      - nemotron-3.5-bolt
      - swift-qwen3.8-27b:q6k-map-k4v
    clean: false

extraEnv:
  - name: OLLAMA_FLASH_ATTENTION
    value: "1"
  - name: OLLAMA_CONTEXT_LENGTH
    value: "262144"
  - name: OLLAMA_KV_CACHE_TYPE
    value: q4_0
  - name: OLLAMA_LOAD_TIMEOUT
    value: 30m
  - name: OLLAMA_KEEP_ALIVE
    value: "-1"
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "1"

service:
  type: ClusterIP
  port: 11434

ingress:
  enabled: true
  className: tailscale
  annotations:
    tailscale.com/proxy-class: "pin-framework-desktop"
  hosts:
    - host: ollama
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ollama

persistentVolume:
  enabled: true
  existingClaim: ollama-data

nodeSelector:
  kubernetes.io/hostname: framework-desktop

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ollama-data
      namespace: ollama
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
