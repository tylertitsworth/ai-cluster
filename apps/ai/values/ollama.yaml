# ollama chart values for AMD ROCm + Tailscale ingress
fullnameOverride: ollama

image:
  repository: ghcr.io/tylertitsworth/ollama-swift
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

ollama:
  gpu:
    enabled: true
    type: amd
    number: 1

lifecycle:
  postStart:
    exec:
      command:
        - /bin/sh
        - -c
        - |
          MODEL=swift-qwen3.8-27b:q6k-map-k4v
          LOG=/tmp/ollama-preload.log
          DONE=/tmp/ollama-preload.done
          rm -f "$DONE"

          (
            trap 'echo $? >"$DONE"' EXIT
            i=0
            until /bin/ollama ps >/dev/null 2>&1; do
              i=$((i + 1))
              if [ "$i" -ge 120 ]; then
                echo "ollama server not ready after 600s" >&2
                exit 0
              fi
              sleep 5
            done

            cat <<MODELLEOF > /root/.ollama/models/$MODEL
          FROM hf.co/ukisai/Swift-Qwen3.8-27B-GGUF:Q6_K

          RENDERER qwen3.8
          PARSER qwen3.5

          PARAMETER temperature 0.6
          PARAMETER top_k 20
          PARAMETER top_p 0.95
          PARAMETER min_p 0
          PARAMETER presence_penalty 0
          PARAMETER repeat_penalty 1
          PARAMETER num_batch 512
          PARAMETER num_predict -1

          PARAMETER draft_spec_type draft-mtp,ngram-map-k4v
          PARAMETER draft_num_predict 3
          PARAMETER draft_ngram_map_k4v_size_n 12
          PARAMETER draft_ngram_map_k4v_size_m 48
          PARAMETER draft_ngram_map_k4v_min_hits 1
          MODELLEOF
            /bin/ollama create "$MODEL" -f /root/.ollama/models/$MODEL

            /bin/ollama list | awk 'NR>1 {print $1}' | while read -r m; do
              [ "$m" = "$MODEL" ] || /bin/ollama rm "$m"
            done

            /bin/ollama run "$MODEL" " " >/dev/null 2>&1
          ) >"$LOG" 2>&1 &

          i=0
          while [ "$i" -lt 12 ]; do
            if /bin/ollama ps | grep -qF "$MODEL"; then
              echo "postStart: $MODEL is resident"
              exit 0
            fi
            if [ -f "$DONE" ]; then
              echo "postStart: preload exited (status $(cat "$DONE")):" >&2
              cat "$LOG" >&2
              exit 0
            fi
            i=$((i + 1))
            sleep 5
          done
          echo "postStart: $MODEL preloading in background, log $LOG"
          exit 0

extraEnv:
  - name: OLLAMA_FLASH_ATTENTION
    value: "1"
  - name: OLLAMA_CONTEXT_LENGTH
    value: "262144"
  - name: OLLAMA_KV_CACHE_TYPE
    value: q4_0
  - name: OLLAMA_LOAD_TIMEOUT
    value: 30m
  - name: OLLAMA_KEEP_ALIVE
    value: "-1"
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "1"

service:
  type: ClusterIP
  port: 11434

ingress:
  enabled: true
  className: tailscale
  annotations:
    tailscale.com/proxy-class: "pin-framework-desktop"
  hosts:
    - host: ollama
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ollama

persistentVolume:
  enabled: true
  existingClaim: ollama-data

nodeSelector:
  kubernetes.io/hostname: framework-desktop

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ollama-data
      namespace: ollama
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
