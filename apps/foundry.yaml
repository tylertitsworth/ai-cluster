# Foundry Virtual Tabletop
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundry
  namespace: argocd
  labels:
    stack: ai
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Umbrella chart: pulls upstream foundry-vtt as a dependency and adds the
    # Tailscale ingress template. The dependency is built by ArgoCD at sync time.
    - repoURL: https://github.com/tylertitsworth/ai-cluster.git
      targetRevision: main
      path: charts/foundry
      helm:
        valueFiles:
          - $values/apps/values/foundry-values.yaml
    - repoURL: https://github.com/tylertitsworth/ai-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: foundry
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
