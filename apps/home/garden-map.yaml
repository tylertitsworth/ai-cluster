# Garden Map — Seasonal Tasks & Site Map (home stack)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garden-map
  namespace: argocd
  labels:
    stack: home
  annotations:
    # argocd-image-updater: track :latest by digest; pins latest@sha256 into
    # charts/garden-map/values.yaml via git write-back (selfHeal requires
    # the change to land in git, not on the live Application object)
    argocd-image-updater.argoproj.io/image-list: gardenmap=ghcr.io/tylertitsworth/garden-map:latest
    argocd-image-updater.argoproj.io/gardenmap.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:./values.yaml
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: garden-map
  source:
    repoURL: https://github.com/tylertitsworth/ai-cluster
    targetRevision: main   # image updater commits digest bumps here
    path: charts/garden-map
    helm:
      valueFiles:
        - values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
