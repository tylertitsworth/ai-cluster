# Mealie
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mealie
  namespace: argocd
  labels:
    stack: home
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: mealie
  source:
    repoURL: https://github.com/tylertitsworth/ai-cluster
    targetRevision: main
    path: charts/mealie
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: storage.className
          value: longhorn
        - name: storage.mealieSize
          value: 1Gi
        - name: storage.postgresSize
          value: 1Gi
        - name: postgres.enabled
          value: "true"
        - name: image.tag
          value: v3.12.0
        - name: ingress.className
          value: tailscale
        - name: ingress.enabled
          value: "true"
        - name: ingress.hosts[0].host
          value: mealie.tail79a5c8.ts.net
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: mealie-pgdata
      jsonPointers:
        - /spec/volumeName
