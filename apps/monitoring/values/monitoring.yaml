# https://github.com/prometheus-community/helm-charts/tree/kube-prometheus-stack-66.3.1/charts/kube-prometheus-stack
alertmanager:
  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
grafana:
  # Bumped off chart-default 11.3.x: the DB schema was migrated by an 11.6.x Grafana
  # (guid columns on alert_rule/alert_rule_version), but 11.3 doesn't populate guid at
  # runtime -> Grafana-managed alert create/edit fails on UNIQUE guid. 11.6.16 owns the
  # schema. Follow-up: bump the kube-prometheus-stack chart for a supported Grafana (12.4/13).
  image:
    tag: "11.6.16"
  assertNoLeakedSecrets: false
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    security:
      allow_embedding: true
    server:
      root_url: https://grafana.tail79a5c8.ts.net
  ingress:
    enabled: true
    hosts:
      - grafana
    ingressClassName: tailscale
    labels:
      tailscale.com/proxy-class: "pin-npu01"
    tls:
      - hosts:
          - grafana
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
prometheus:
  additionalServiceMonitors:
    - name: amdgpu-exporter
      selector:
        matchLabels:
          app: amdgpu-exporter
      endpoints:
        - port: http
          interval: 10s
  ingress:
    enabled: true
    hosts:
      - prometheus
    ingressClassName: tailscale
    labels:
      tailscale.com/proxy-class: "control-plane"
    paths: ["/"]
    tls:
      - hosts:
          - prometheus
prometheus-node-exporter:
  extraArgs:
    - --collector.disable-defaults
    - --collector.cpu
    - --collector.meminfo
    - --collector.diskstats
    - --collector.filesystem
    - --collector.netdev
    - --collector.netstat
    - --collector.time
    - --collector.uname
    - --collector.vmstat
prometheusOperator:
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
