# Jetson Exporter - Prometheus metrics for NVIDIA Jetson devices
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jetson-exporter
  namespace: argocd
  labels:
    stack: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tylertitsworth/ai-cluster.git
    targetRevision: main
    path: jetson-exporter
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
