# Templates: OpenCode BYO Harness + OpenCode Zen/Go model providers for kagent 1.0.1
# These are NOT applied by ArgoCD. Fill placeholders, then apply manually:
#   kubectl apply -f apps/platform/opencode-templates.yaml
#
# Notes:
# - BYO Harness requires an image that implements kagent's private A2A contract.
#   spec.workload.image MUST be digest-pinned (repo@sha256:...). There is no
#   official "opencode harness" image in kagent 1.0.1; replace IMAGE_DIGEST with
#   a real compatible image. Without a valid image this Harness won't run.
# - Claude/Codex harness runtimes are model-runtime specific; for Ollama-backed
#   agents use the kagent runtime/harness (or a compatible BYO runtime).
# - OpenCode Zen/Go endpoints are OpenAI-compatible in many clients; availability
#   of "free" models/tiers and auth requirements depend on OpenCode's current
#   terms. Create the referenced Secrets with your API keys where required.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: opencode-default
  namespace: kagent
spec:
  byo: {}
  workload:
    # REQUIRED: replace with a real digest-pinned image implementing kagent A2A contract
    # image: ghcr.io/<org>/<opencode-harness>@sha256:<digest>
    image: ghcr.io/REPLACE_ME/opencode-harness@sha256:REPLACE_WITH_64_HEX_DIGEST
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
# OpenCode Go free models (OpenAI-compatible, $0 input/output on /zen/go/v1/models).
# No API key configured here; if the endpoint requires auth in your environment,
# add apiKeySecret/apiKeySecretKey and create the Secret.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: opencode-go-beam-free
  namespace: kagent
spec:
  provider: OpenAI
  model: beam-free
  openAI:
    baseUrl: https://opencode.ai/zen/go/v1
    apiFormat: chatCompletions
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: opencode-go-iceman-contributor-free
  namespace: kagent
spec:
  provider: OpenAI
  model: iceman-contributor-free
  openAI:
    baseUrl: https://opencode.ai/zen/go/v1
    apiFormat: chatCompletions
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: opencode-go-longcat-2-5-free
  namespace: kagent
spec:
  provider: OpenAI
  model: longcat-2.5-free
  openAI:
    baseUrl: https://opencode.ai/zen/go/v1
    apiFormat: chatCompletions
---
# OpenCode Zen (OpenAI-compatible). Create secret: kubectl -n kagent create secret generic opencode-zen --from-literal=OPENAI_API_KEY='<key>'
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: opencode-zen
  namespace: kagent
spec:
  provider: OpenAI
  # Replace with an available model ID (free/paid availability varies)
  model: REPLACE_MODEL_ID
  apiKeySecret: opencode-zen
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: https://opencode.ai/zen/v1
    apiFormat: chatCompletions
---
# Ollama-backed model (example; cluster already has ollama-swift-qwen38-27b/default-model-config)
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: ollama-local-example
  namespace: kagent
spec:
  provider: Ollama
  model: swift-qwen3.8-27b:q6k-map-k4v
  ollama:
    host: http://ollama.ollama.svc.cluster.local:11434
  stream: true
