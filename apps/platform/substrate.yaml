# Substrate
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate
  namespace: argocd
  labels:
    stack: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: ate-api-server
      namespace: ate-system
      jsonPointers:
        - /spec/template/spec/containers/0/args
  sources:
    - repoURL: oci://ghcr.io/kagent-dev/substrate/helm/substrate
      chart: substrate
      targetRevision: 1.0.0
      helm:
        valueFiles:
          - $values/apps/platform/values/substrate.yaml
    - repoURL: https://github.com/tylertitsworth/ai-cluster.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
