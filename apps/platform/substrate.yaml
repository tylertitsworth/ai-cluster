# Substrate
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate
  namespace: argocd
  labels:
    stack: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  sources:
    - repoURL: oci://ghcr.io/kagent-dev/substrate/helm/substrate
      chart: substrate
      targetRevision: 1.0.0
      helm:
        valueFiles:
          - $values/apps/platform/values/substrate.yaml
    - repoURL: https://github.com/tylertitsworth/ai-cluster.git
      targetRevision: feature/kagent-substrate
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true