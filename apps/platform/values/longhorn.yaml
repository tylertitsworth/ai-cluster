# https://github.com/longhorn/longhorn/tree/master/chart
defaultSettings:
  defaultDataPath: /storage
networkPolicies:
  enabled: false
  restrictInternalTraffic: false
persistence:
  backupTargetName: cloudflare
metrics:
  serviceMonitor:
    additionalLabels:
      prometheus: monitoring-kube-prometheus-prometheus
      release: monitoring
    enabled: true
ingress:
  enabled: true
  host: longhorn
  ingressClassName: tailscale
  tls: true
  tlsSecret:
