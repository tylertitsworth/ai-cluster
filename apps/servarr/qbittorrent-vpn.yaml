# qBittorrent behind a Gluetun VPN sidecar
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qbittorrent-vpn
  namespace: argocd
  labels:
    stack: servarr
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      targetRevision: 3.5.1
      helm:
        valueFiles:
          - $values/apps/servarr/values/qbittorrent-vpn.yaml
    - repoURL: https://github.com/tylertitsworth/ai-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: servarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true