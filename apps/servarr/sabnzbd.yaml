# SABnzbd - Usenet Downloader (for arr-media-guard subtitle hunter)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sabnzbd
  namespace: argocd
  labels:
    stack: servarr
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tylertitsworth/ai-cluster.git
    targetRevision: main
    path: charts/servarr/sabnzbd
  destination:
    server: https://kubernetes.default.svc
    namespace: servarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true