# https://github.com/christian-schlichtherle/synology-csi-chart
# Credentials live in a pre-created Secret (synology-csi-client-info, synology-csi ns),
# not in git.
clientInfoSecret:
  create: false
  name: synology-csi-client-info

storageClasses:
  # iSCSI is RWO-only (doesn't fit shared media-library/downloads volumes) and
  # SMB breaks Sonarr/Radarr atomic-rename imports - disabled to avoid accidental use.
  iscsi-delete:
    disabled: true
  iscsi-retain:
    disabled: true
  smb-delete:
    disabled: true
  smb-retain:
    disabled: true
  nfs-delete:
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    mountOptions:
      - vers=4.1
      - noatime
    parameters:
      protocol: nfs
      dsm: 10.0.0.181
      location: /volume1
      mountPermissions: "0755"
  nfs-retain:
    reclaimPolicy: Retain
    allowVolumeExpansion: true
    mountOptions:
      - vers=4.1
      - noatime
    parameters:
      protocol: nfs
      dsm: 10.0.0.181
      location: /volume1
      mountPermissions: "0755"
