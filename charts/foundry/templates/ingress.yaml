{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.service.name }}
  labels:
    {{- include "foundry.labels" . | nindent 4 }}
  {{- with .Values.ingress.proxyClass }}
  annotations:
    tailscale.com/proxy-class: {{ . }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.service.name }}
                port:
                  number: {{ .Values.ingress.service.port }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
{{- end }}
