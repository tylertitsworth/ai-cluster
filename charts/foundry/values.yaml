# Default values for the foundry umbrella chart.
# NOTE: No credentials live here. License key / passwords are stored in the
# pre-created Kubernetes Secret "foundry" and referenced via configSecretName.

# Values for the upstream foundry-vtt dependency are nested under its chart name.
foundry-vtt:
  fullnameOverride: foundry
  image:
    repository: felddy/foundryvtt
    pullPolicy: IfNotPresent
  foundryvtt:
    # Existing Secret with adminPassword/username/password/licenseKey/releaseUrl.
    # When set, account settings from values are ignored.
    configSecretName: foundry
    hostname: foundry.tail79a5c8.ts.net
    cssTheme: foundry
  # ClusterIP only — our Tailscale Ingress handles external exposure, so we don't
  # consume a MetalLB LoadBalancer IP here.
  service:
    serviceType: ClusterIP
    port: 80
    tls: false
  # The upstream chart's ingress only renders for class nginx/contour/traefik and
  # cannot emit a tailscale-class Ingress. Disable it; we provide our own below.
  ingress:
    enabled: false
  persistence:
    enabled: true
    storageClass: longhorn
    size: 8Gi

# Tailscale Ingress rendered by this chart's templates/ingress.yaml.
ingress:
  enabled: true
  className: tailscale
  # Short hostname only — Tailscale assigns the FQDN from the tailnet.
  host: foundry
  proxyClass: control-plane
  service:
    name: foundry
    port: 80
