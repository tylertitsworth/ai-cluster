# Default values for the foundry umbrella chart.
# NOTE: No credentials live here. License key / passwords are stored in the
# pre-created Kubernetes Secret "foundry" and referenced via configSecretName.

# Values for the upstream foundry-vtt dependency are nested under its chart name.
foundry-vtt:
  foundryvtt:
    configSecretName: foundry
    hostname: foundry.tail79a5c8.ts.net
    cssTheme: foundry

# Tailscale Ingress rendered by this chart's templates/ingress.yaml.
ingress:
  enabled: false
