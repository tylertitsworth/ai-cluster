# Garden Map — interactive garden site map (ghcr.io/tylertitsworth/garden-map).
#
# User data (plants.json) lives ONLY on the data PVC at /app/data; the image
# ships no seed. First boot serves 404s until the PVC is seeded once — see
# garden-map repo DEPLOY.md.
# Full app-template schema: https://github.com/bjw-s-labs/helm-charts/tree/main/charts/app-template
app-template:
  defaultPodOptions:
    imagePullSecrets:
      - name: ghcr-pull   # private ghcr image; secret pre-created in the namespace

  controllers:
    main:
      type: deployment
      replicas: 1
      strategy: Recreate   # single RWO PVC

      pod:
        securityContext:
          fsGroup: 65534   # longhorn volume is root-owned; nobody must write plants.json

      containers:
        main:
          image:
            repository: ghcr.io/tylertitsworth/garden-map
            tag: latest
            pullPolicy: Always

          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 10
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /index.html
                  port: 80
                initialDelaySeconds: 5
                periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

  service:
    main:
      controller: main
      ports:
        http:
          port: 80

  ingress:
    main:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/proxy-class: pin-framework-desktop
      hosts:
        - host: garden
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - garden

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: longhorn
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
