# Halogen inference server — Qwen3.8-27B GGUF benchmark on framework-desktop.
# Reuses the Swift Q6_K GGUF already on the ollama-data PVC; the head/tokenizer
# are fetched beside it on first start by HALOGEN_DOWNLOAD.
app-template:
  controllers:
    halogen:
      type: deployment
      replicas: 1
      strategy: Recreate

      containers:
        main:
          image:
            repository: ghcr.io/peonist-ai/halogen-flash-server
            tag: "0.21.0"
            pullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: halogen-config
          securityContext:
            privileged: true
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8731
                initialDelaySeconds: 300
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 24
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8731
                # First start downloads the draft head and repacks the GGUF.
                initialDelaySeconds: 7200
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 6
          resources:
            requests:
              amd.com/gpu: "1"
            limits:
              amd.com/gpu: "1"

      pod:
        hostIPC: true
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - framework-desktop

  service:
    main:
      controller: halogen
      type: ClusterIP
      ports:
        http:
          port: 8731

  ingress:
    main:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/proxy-class: pin-framework-desktop
      hosts:
        - host: halogen
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - halogen

  persistence:
    models:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: ollama-data
      globalMounts:
        - path: /root/.ollama

# Rendered into halogen-config and injected with envFrom.
# Published defaults kept 1:1: CTX, prompt cache, slots.
# Forced deviations for the 64 GB box: KV pool and host reserve.
config:
  - key: HALOGEN_CHECKPOINT
    value: /root/.ollama/models/blobs/qwen38-27b-swift-q6k.gguf
  # The 27B repo has no standalone MTP head; the engine's GGUF path expects
  # qwen38-flash-next-mtp.hgn, which lives in the flash-next repo. Its tokenizer
  # is the same one 27B uses. No ht4 weights are fetched while GGUF is served.
  - key: HALOGEN_DOWNLOAD
    value: peonist-ai/halogen-qwen3.8-flash-next
  - key: HALOGEN_API_PORT
    value: "8731"
  - key: HALOGEN_MODEL_ID
    value: halogen-qwen3.8-27b
  - key: HALOGEN_CTX
    value: "262144"
  - key: HALOGEN_KV_POOL_POSITIONS
    value: "262144"
  - key: HALOGEN_KV_SLOTS
    value: "4"
  - key: HALOGEN_PROMPT_CACHE
    value: "2"
  - key: HALOGEN_HOST_RESERVE_GIB
    value: "8"
