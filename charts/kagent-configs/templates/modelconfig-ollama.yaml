{{- if .Values.modelConfigs.ollama.enabled }}
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: {{ .Values.modelConfigs.ollama.name }}
  namespace: {{ .Values.modelConfigs.ollama.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider: {{ .Values.modelConfigs.ollama.provider }}
  model: {{ .Values.modelConfigs.ollama.model }}
  ollama:
    host: {{ .Values.modelConfigs.ollama.host }}
  stream: {{ .Values.modelConfigs.ollama.stream }}
{{- end }}
