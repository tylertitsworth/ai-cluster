app-template:
  controllers:
    arr-media-guard:
      replicas: 1
      strategy: Recreate
      pod:
        # AMG finishes an in-flight check on shutdown; the image asks for 60s.
        terminationGracePeriodSeconds: 60

      containers:
        main:
          image:
            repository: ghcr.io/samwiseg0/arr-media-guard
            tag: latest
            pullPolicy: Always

          env:
            - name: TZ
              value: America/Los_Angeles
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # The arr apps see the media at /media; AMG mounts it at /data.
            - name: PATH_MAP
              value: /media:/data
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-media-guard
                  key: radarr-api-key
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-media-guard
                  key: sonarr-api-key

          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi

  service:
    main:
      controller: arr-media-guard
      ports:
        webhook:
          port: 8484

  ingress:
    main:
      enabled: true
      className: tailscale
      hosts:
        - host: arr-media-guard
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: webhook
      annotations:
        tailscale.com/proxy-class: "pin-framework-desktop"
      tls:
        - hosts:
            - arr-media-guard

  persistence:
    config:
      enabled: true
      existingClaim: arr-media-guard-config-v1
      globalMounts:
        - path: /config

    state:
      enabled: true
      existingClaim: arr-media-guard-state-v1
      globalMounts:
        - path: /config/state

    media:
      enabled: true
      existingClaim: media-library
      globalMounts:
        - path: /data
          readOnly: false
