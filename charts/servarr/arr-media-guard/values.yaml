app-template:
  # The audio/subtitle policy, mounted read-only at /policy/policy.json
  # (POLICY_FILE). Edit here; the checksum rolls the pod on change.
  configMaps:
    policy:
      includeInChecksum: true
      data:
        policy.json: |
          {
            "kids": {
              "genres": {"radarr": ["Family"], "sonarr": ["Children", "Family"]},
              "profiles": ["Kids"],
              "studios": ["Studio A"]
            },
            "audio": {
              "english": ["original"],
              "foreign": ["original", "english"],
              "foreign_kids": ["english", "original"]
            },
            "subtitles": {
              "english": ["forced"],
              "foreign": ["full", "sdh", "forced", "dub"]
            },
            "sparse_events": 1.5,
            "forced_flag_events": 4.0,
            "density_min_minutes": 15,
            "min_confidence": 0.7,
            "forced_clear": {
              "events": 10.0,
              "english_only_audio": true,
              "reference_ratio": 0.8
            }
          }

  controllers:
    arr-media-guard:
      replicas: 1
      strategy: Recreate
      pod:
        # AMG finishes an in-flight check on shutdown; the image asks for 60s.
        terminationGracePeriodSeconds: 60

      containers:
        main:
          image:
            repository: ghcr.io/samwiseg0/arr-media-guard
            tag: latest
            pullPolicy: Always

          env:
            - name: TZ
              value: America/Los_Angeles
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # The arr apps see the media at /media; AMG mounts it at /data.
            - name: PATH_MAP
              value: /media:/data
            # Outside /config: the entrypoint chowns /config, which fails on a
            # read-only configmap file.
            - name: POLICY_FILE
              value: /policy/policy.json
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-media-guard
                  key: radarr-api-key
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-media-guard
                  key: sonarr-api-key

          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi

  service:
    main:
      controller: arr-media-guard
      ports:
        webhook:
          port: 8484

  persistence:
    config:
      enabled: true
      existingClaim: arr-media-guard-config-v1
      globalMounts:
        - path: /config

    policy:
      type: configMap
      name: arr-media-guard-policy
      items:
        - key: policy.json
          path: policy.json
      globalMounts:
        - path: /policy/policy.json
          subPath: policy.json

    state:
      enabled: true
      existingClaim: arr-media-guard-state-v1
      globalMounts:
        - path: /config/state

    media:
      enabled: true
      existingClaim: media-library
      globalMounts:
        - path: /data
          readOnly: false
