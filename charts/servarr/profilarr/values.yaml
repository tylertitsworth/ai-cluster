app-template:
  controllers:
    profilarr:
      replicas: 1
      strategy: Recreate

      containers:
        main:
          image:
            repository: ghcr.io/dictionarry-hub/profilarr
            tag: latest
            pullPolicy: Always

          env:
            TZ: America/Los_Angeles
            # profilarr 2.x CSRF-checks Origin; Tailscale terminates TLS and
            # proxies over http, so it must be told the external https URL.
            ORIGIN: https://profilarr.tail79a5c8.ts.net

          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 6868
                initialDelaySeconds: 30
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 6868
                initialDelaySeconds: 30
                periodSeconds: 10

          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 1Gi  # dictionarry-hub image OOMs at 512Mi on startup


  service:
    main:
      controller: profilarr
      ports:
        http:
          port: 6868

  ingress:
    main:
      enabled: true
      className: tailscale
      hosts:
        - host: profilarr
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      annotations:
        tailscale.com/proxy-class: "pin-framework-desktop"
      tls:
        - hosts:
            - profilarr

  persistence:
    config:
      enabled: true
      existingClaim: profilarr-config
      globalMounts:
        - path: /config
