apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: {{ .Release.Namespace }}
data:
  # vLLM serve configuration file: https://docs.vllm.ai/en/stable/configuration/serve_args/
  config.yaml: |
{{ range .Values.config }}    {{ .key }}: {{ .value }}
{{ end }}
  # Qwen3.x chat template patched to coalesce leading system messages instead of
  # raising "System message must be at the beginning." (opencode sends 2+ system
  # messages). Referenced by `chat-template` in .Values.config.
  chat_template.jinja: |
{{ .Files.Get "chat_template.jinja" | indent 4 }}
