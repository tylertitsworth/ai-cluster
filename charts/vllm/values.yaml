app-template:
  controllers:
    vllm:
      type: deployment
      replicas: 1
      strategy: Recreate

      containers:
        main:
          image:
            repository: docker.io/kyuz0/vllm-therock-gfx1151
            tag: latest
            pullPolicy: Always
          command:
            - /bin/bash
            - -c
            - python /root/.cache/huggingface/patch_rocm.py && exec vllm serve --config /vllm/config/config.yaml
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: LD_PRELOAD
              value: /root/.cache/huggingface/hip_mem_override.so
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: VLLM_DISABLE_COMPILE_CACHE
              value: "1"
            - name: VLLM_USE_TRITON_AWQ
              value: "1"
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v1/models
                  port: 8000
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 6
          resources:
            requests:
              amd.com/gpu: "1"
            limits:
              amd.com/gpu: "1"

      pod:
        # Pin to the node with the GPU (mirrors the original deployment nodeSelector)
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - framework-desktop

  service:
    main:
      controller: vllm
      type: ClusterIP
      ports:
        http:
          port: 8000

  ingress:
    main:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/proxy-class: "pin-framework-desktop"
      hosts:
        - host: vllm
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - vllm

  persistence:
    vllm-config:
      enabled: true
      type: configMap
      name: vllm-config
      globalMounts:
        - path: /vllm/config
    hf-cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: vllm-hf-cache
      globalMounts:
        - path: /root/.cache/huggingface

# -- vLLM serve configuration, rendered to config.yaml and loaded via `vllm serve --config`.
# Long-form arg names: https://docs.vllm.ai/en/stable/configuration/serve_args/
# Order is significant: matches the live ConfigMap so a sync is a no-op.
config:
  - key: attention-backend
    value: ROCM_ATTN
  - key: chat-template
    value: /vllm/config/chat_template.jinja
  - key: enable-prefix-caching
    value: true
  - key: enable-chunked-prefill
    value: true
  - key: dtype
    value: auto
  - key: enable-auto-tool-choice
    value: true
  - key: gpu-memory-utilization
    value: 0.8
  - key: host
    value: 0.0.0.0
  - key: max-model-len
    value: 262144
  - key: max-num-seqs
    value: 4
  - key: mm-encoder-attn-backend
    value: TRITON_ATTN
  - key: model
    value: cyankiwi/Qwen3.8-27B-AWQ-INT4
  - key: port
    value: 8000
  - key: reasoning-parser
    value: qwen3
  - key: tensor-parallel-size
    value: 1
  - key: tool-call-parser
    value: qwen3_xml
  - key: trust-remote-code
    value: true