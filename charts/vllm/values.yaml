app-template:
  controllers:
    vllm:
      type: deployment
      replicas: 1
      strategy: Recreate

      containers:
        main:
          image:
            repository: docker.io/kyuz0/vllm-therock-gfx1151
            tag: latest
            pullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |-
              exec vllm serve \
                --config /vllm/config/config.yaml
          env:
            LD_PRELOAD: /root/.cache/huggingface/hip_mem_override.so
            PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
            HF_HUB_OFFLINE: "1"
            VLLM_USE_TRITON_AWQ: "1"
            VLLM_DISABLE_COMPILE_CACHE: "1"
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v1/models
                  port: 8000
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 6

      # Pin to the node with the GPU (mirrors the original deployment nodeSelector)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - framework-desktop

  service:
    main:
      controller: vllm
      type: ClusterIP
      ports:
        http:
          port: 8000

  ingress:
    main:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/proxy-class: "pin-framework-desktop"
      hosts:
        - host: vllm
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - vllm

  persistence:
    vllmConfig:
      enabled: true
      type: configMap
      name: vllm-config
      globalMounts:
        - path: /vllm/config
    hfCache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: vllm-hf-cache
      globalMounts:
        - path: /root/.cache/huggingface

  resources:
    requests:
      amd.com/gpu: "1"
    limits:
      amd.com/gpu: "1"

# -- vLLM serve configuration, rendered to config.yaml and loaded via `vllm serve --config`.
# Long-form arg names: https://docs.vllm.ai/en/stable/configuration/serve_args/
config:
  model: cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
  host: 0.0.0.0
  port: 8000
  tensor-parallel-size: 1
  max-num-seqs: 5
  max-model-len: 262144
  gpu-memory-utilization: 0.80
  dtype: auto
  trust-remote-code: true
  attention-backend: TRITON_ATTN
  mm-encoder-attn-backend: TRITON_ATTN
  enable-auto-tool-choice: true
  tool-call-parser: qwen3_xml
  reasoning-parser: qwen3