app-template:
  controllers:
    vllm:
      type: deployment
      replicas: 1
      strategy: Recreate

      containers:
        main:
          image:
            repository: docker.io/kyuz0/vllm-therock-gfx1151
            tag: latest
            pullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |-
              set -a
              source /vllm/kwargs/run
              set +a
              exec vllm serve \
                "${MODEL}" \
                --host "${HOST}" \
                --port "${PORT}" \
                --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
                --max-num-seqs "${MAX_NUM_SEQS}" \
                --max-model-len "${MAX_MODEL_LEN}" \
                --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
                --dtype "${DTYPE}" \
                --trust-remote-code \
                --attention-backend "${ATTENTION_BACKEND}" \
                --mm-encoder-attn-backend "${MM_ENCODER_ATTN_BACKEND}" \
                --enable-auto-tool-choice \
                --tool-call-parser "${TOOL_CALL_PARSER}" \
                --reasoning-parser "${REASONING_PARSER}"
          env:
            LD_PRELOAD: /root/.cache/huggingface/hip_mem_override.so
            PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
            HF_HUB_OFFLINE: "1"
            VLLM_USE_TRITON_AWQ: "1"
            VLLM_DISABLE_COMPILE_CACHE: "1"
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v1/models
                  port: 8000
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 6

  service:
    main:
      controller: vllm
      type: ClusterIP
      ports:
        http:
          port: 8000

  ingress:
    main:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/proxy-class: "pin-framework-desktop"
      hosts:
        - host: vllm
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - vllm

  persistence:
    kwargs:
      enabled: true
      type: configMap
      name: vllm-kwargs
      globalMounts:
        - path: /vllm/kwargs
    hfCache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: vllm-hf-cache
      globalMounts:
        - path: /root/.cache/huggingface

  resources:
    requests:
      amd.com/gpu: "1"
    limits:
      amd.com/gpu: "1"

# -- kwargs for the vllm serve command, rendered to a ConfigMap
kwargs:
  MODEL: cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
  HOST: "0.0.0.0"
  PORT: "8000"
  TENSOR_PARALLEL_SIZE: "1"
  MAX_NUM_SEQS: "5"
  MAX_MODEL_LEN: "262144"
  GPU_MEMORY_UTILIZATION: "0.80"
  DTYPE: auto
  ATTENTION_BACKEND: TRITON_ATTN
  MM_ENCODER_ATTN_BACKEND: TRITON_ATTN
  TOOL_CALL_PARSER: qwen3_xml
  REASONING_PARSER: qwen3
