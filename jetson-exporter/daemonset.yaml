apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jetson-exporter
  namespace: grafana
spec:
  selector:
    matchLabels:
      app: jetson-exporter
  template:
    metadata:
      labels:
        app: jetson-exporter
    spec:
      nodeSelector:
        node-type: jetson
      containers:
        - name: jetson-exporter
          image: ghcr.io/tylertitsworth/jetson-exporter:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: jtop-sock
              mountPath: /run/jtop.sock
              readOnly: true
      volumes:
        - name: jtop-sock
          hostPath:
            path: /run/jtop.sock
