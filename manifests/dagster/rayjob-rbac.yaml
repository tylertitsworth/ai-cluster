# RBAC for Dagster (release "dagster") to submit KubeRay RayJob CRs and read
# them back while polling. The K8s run pods (launched by K8sRunLauncher)
# inherit the code server deployment's service account, which the helm chart
# names after the user-deployments subchart. The RayJobs live in the
# "kuberay" namespace and the role itself is shared with Airflow
# (manifests/airflow/rayjob-rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dagster-rayjob
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: airflow-rayjob
subjects:
  - kind: ServiceAccount
    name: dagster-dagster-user-deployments-user-deployments
    namespace: dagster
