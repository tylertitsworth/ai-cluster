apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: garden-map
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd   # pins latest@<digest> as a helm parameter on the live
                     # Application; no git credentials involved
  applicationRefs:
    - namePattern: garden-map
      images:
        - alias: gardenmap
          imageName: ghcr.io/tylertitsworth/garden-map:latest
          commonUpdateSettings: {updateStrategy: digest, forceUpdate: false}
          manifestTargets:
            helm:
              name: app-template.controllers.main.containers.main.image.repository
              tag: app-template.controllers.main.containers.main.image.tag
