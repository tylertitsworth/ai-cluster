# RBAC for Prefect (release "prefect-server") to submit KubeRay RayJob CRs and
# read them back while polling. Bound to the server's service account; the
# RayJobs live in the "kuberay" namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prefect-rayjob
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayjobs/status"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prefect-rayjob
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prefect-rayjob
subjects:
  - kind: ServiceAccount
    name: prefect-server
    namespace: prefect
