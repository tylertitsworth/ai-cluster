# RBAC for Prefect (release "prefect-server") to submit KubeRay RayJob CRs and
# read them back while polling. Bound to the server's service account; the
# RayJobs live in the "kuberay" namespace and the role is shared with Airflow
# and Dagster (manifests/airflow/rayjob-rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prefect-rayjob
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: airflow-rayjob
subjects:
  - kind: ServiceAccount
    name: prefect-server
    namespace: prefect
