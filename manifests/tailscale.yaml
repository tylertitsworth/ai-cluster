apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  tailscale.server: |
    ts.net:53 {
      errors
      cache 30
      forward . 10.43.240.44
    }
---
apiVersion: tailscale.com/v1alpha1
kind: DNSConfig
metadata:
  name: ts-dns
spec:
  nameserver:
    image:
      repo: tailscale/k8s-nameserver
      tag: unstable
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: control-plane
spec:
  statefulSet:
    pod:
      nodeSelector:
        tailscale-ingress: "enabled"
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
  metrics:
    enable: true
    serviceMonitor:
      enable: true
      labels:
        prometheus: monitoring-kube-prometheus-prometheus
        release: monitoring
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: relay-egress
spec:
  statefulSet:
    pod:
      nodeSelector:
        tailscale-ingress: "enabled"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
  metrics:
    enable: true
    serviceMonitor:
      enable: true
      labels:
        prometheus: monitoring-kube-prometheus-prometheus
        release: monitoring
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: connector-host
spec:
  statefulSet:
    pod:
      nodeSelector:
        kubernetes.io/hostname: framework-desktop
  metrics:
    enable: true
    serviceMonitor:
      enable: true
      labels:
        prometheus: monitoring-kube-prometheus-prometheus
        release: monitoring
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: pin-npu01
spec:
  statefulSet:
    pod:
      nodeSelector:
        kubernetes.io/hostname: npu01.local
  metrics:
    enable: true
    serviceMonitor:
      enable: true
      labels:
        prometheus: monitoring-kube-prometheus-prometheus
        release: monitoring
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: pin-npu02
spec:
  statefulSet:
    pod:
      nodeSelector:
        kubernetes.io/hostname: npu02.local
  metrics:
    enable: true
    serviceMonitor:
      enable: true
      labels:
        prometheus: monitoring-kube-prometheus-prometheus
        release: monitoring
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: pin-framework-desktop
spec:
  statefulSet:
    pod:
      nodeSelector:
        kubernetes.io/hostname: framework-desktop
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: pin-framework-13-laptop
spec:
  statefulSet:
    pod:
      nodeSelector:
        kubernetes.io/hostname: framework-13-laptop
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: pin-orinnx01
spec:
  statefulSet:
    pod:
      nodeSelector:
        kubernetes.io/hostname: orinnx01.local
---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: control-plane
spec:
  proxyClass: connector-host
  subnetRouter:
    advertiseRoutes:
      - "10.42.0.0/15"
      - "10.43.0.0/16"
      - "192.168.0.0/24"
      - "192.168.0.245/32"
---
apiVersion: tailscale.com/v1alpha1
kind: PeerRelay
metadata:
  name: relay
spec:
  replicas: 1
  proxyClass: relay-egress
